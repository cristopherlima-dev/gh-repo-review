<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gh-repo-review</title>
<style>
  :root {
    --bg: #f7f7f5; --card: #ffffff; --texto: #1f1f1d; --texto2: #6b6a65; --borda: #e2e1dc;
    --azul: #185fa5; --azul-bg: #e6f1fb; --verde: #3b6d11; --verde-bg: #eaf3de; --ambar: #854f0b; --ambar-bg: #faeeda;
    --vermelho: #a32d2d; --vermelho-bg: #fcebeb; --cinza-bg: #f1efe8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1b1a; --card: #242423; --texto: #ecebe6; --texto2: #a3a29c; --borda: #3a3a38;
      --azul: #85b7eb; --azul-bg: #0c447c; --verde: #97c459; --verde-bg: #27500a; --ambar: #fac775; --ambar-bg: #633806;
      --vermelho: #f09595; --vermelho-bg: #791f1f; --cinza-bg: #333331;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: var(--bg); color: var(--texto);
         font: 14px/1.5 "Segoe UI", system-ui, sans-serif; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; }
  .topo { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .topo .acoes { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .sub { color: var(--texto2); font-size: 13px; }
  button, select, input[type=text] { font: inherit; color: var(--texto); background: var(--card);
         border: 1px solid var(--borda); border-radius: 6px; padding: 6px 10px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--texto2); }
  button:disabled { opacity: .5; cursor: wait; }
  button.principal { background: var(--azul-bg); color: var(--azul); border-color: var(--azul); }
  button.perigo { color: var(--vermelho); border-color: var(--vermelho); }
  /* Seletor de idioma com bandeiras */
  .idioma { display: inline-flex; border: 1px solid var(--borda); border-radius: 999px; padding: 2px; gap: 2px; }
  .idioma button { border: none; border-radius: 999px; padding: 3px 10px 3px 6px; display: flex; align-items: center; gap: 6px; font-size: 12px; background: transparent; }
  .idioma button.on { background: var(--azul-bg); color: var(--azul); }
  .idioma svg { width: 20px; height: 14px; border-radius: 2px; display: block; }
  .cards { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
  .card { background: var(--card); border: 1px solid var(--borda); border-radius: 8px; padding: 10px 12px; }
  .card .rot { color: var(--texto2); font-size: 12px; }
  .card .num { font-size: 22px; font-weight: 600; }
  .filtros { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .filtros input[type=text] { flex: 1; min-width: 200px; }
  .filtros label { display: flex; align-items: center; gap: 6px; color: var(--texto2); }
  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--borda); border-radius: 8px; overflow: hidden; }
  th { text-align: left; font-weight: 600; font-size: 12px; color: var(--texto2); padding: 8px; border-bottom: 1px solid var(--borda); cursor: pointer; user-select: none; white-space: nowrap; }
  td { padding: 6px 8px; border-bottom: 1px solid var(--borda); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  td input[type=text] { width: 100%; padding: 4px 8px; }
  a { color: var(--azul); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 6px; background: var(--cinza-bg); color: var(--texto2); white-space: nowrap; }
  .parado { color: var(--ambar); font-weight: 600; }
  .desc { color: var(--texto2); font-size: 12px; }
  .status { display: flex; gap: 4px; }
  .status button, .btnClonar { padding: 2px 8px; font-size: 12px; }
  .status button.on[data-s=arquivar] { background: var(--ambar-bg);    color: var(--ambar);    border-color: var(--ambar); }
  .status button.on[data-s=excluir]  { background: var(--vermelho-bg); color: var(--vermelho); border-color: var(--vermelho); }
  .abas { display: flex; gap: 4px; margin-bottom: 10px; }
  .abas button.on { background: var(--azul-bg); color: var(--azul); border-color: var(--azul); }
  .legenda { color: var(--texto2); font-size: 12px; margin-top: 8px; }
  .aviso { color: var(--ambar); font-size: 12px; }
  #pendente { max-width: 380px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ok { color: var(--verde); } .erro { color: var(--vermelho); }
  /* Janelas (modais) */
  .fundo { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; z-index: 10; }
  .fundo.aberto { display: flex; }
  .janela { background: var(--card); border: 1px solid var(--borda); border-radius: 12px; padding: 18px; width: min(520px, 92vw); max-height: 85vh; overflow: auto; }
  .janela h2 { font-size: 16px; font-weight: 600; margin: 0 0 12px; }
  .janela .linha { display: flex; gap: 8px; margin: 4px 0 8px; }
  .janela .linha input { flex: 1; }
  .janela .rodape { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .janela .lista { color: var(--texto2); font-size: 13px; margin: 2px 0 12px; }
  .banner { background: var(--cinza-bg); color: var(--texto2); border-radius: 8px; padding: 8px 12px; font-size: 13px; margin-bottom: 12px; display: none; }
  body.sem-excluir .banner { display: block; }
  body.sem-excluir .so-excluir { display: none; }
  .dono { color: var(--texto2); }
  .so-servidor { display: none; }
  body.servidor .so-servidor { display: initial; }
  body.servidor .so-estatico { display: none; }
</style>
</head>
<body>

<div class="topo">
  <div>
    <h1>gh-repo-review</h1>
    <div class="sub" id="info"></div>
  </div>
  <div class="acoes">
    <span class="aviso" id="pendente"></span>
    <div class="idioma" role="group" aria-label="Language / Idioma">
      <button data-idioma="en" aria-label="English (US)">
        <svg viewBox="0 0 19 13" aria-hidden="true"><rect width="19" height="13" fill="#B22234"/><g fill="#fff"><rect y="1" width="19" height="1"/><rect y="3" width="19" height="1"/><rect y="5" width="19" height="1"/><rect y="7" width="19" height="1"/><rect y="9" width="19" height="1"/><rect y="11" width="19" height="1"/></g><rect width="8" height="7" fill="#3C3B6E"/></svg>EN
      </button>
      <button data-idioma="pt-BR" aria-label="Português (Brasil)">
        <svg viewBox="0 0 20 14" aria-hidden="true"><rect width="20" height="14" fill="#009C3B"/><polygon points="10,1.5 18.5,7 10,12.5 1.5,7" fill="#FFDF00"/><circle cx="10" cy="7" r="3.2" fill="#002776"/><path d="M6.9 6.4 Q10 5.6 13.1 7.3" stroke="#fff" stroke-width="0.6" fill="none"/></svg>PT-BR
      </button>
    </div>
    <button class="so-servidor" id="btnRelatorio" data-t="relatorio"></button>
    <button class="so-servidor" id="btnAtualizar" data-t="atualizar"></button>
    <button class="so-estatico" id="btnExportar" data-t="exportar"></button>
    <button class="so-servidor principal" id="btnAplicar" data-t="aplicar"></button>
  </div>
</div>

<div class="banner" id="bannerExcluir" data-t-html="banner_excluir"></div>

<div class="cards">
  <div class="card"><div class="rot" data-t="c_ativos"></div><div class="num" id="cAtivos">0</div></div>
  <div class="card"><div class="rot" data-t="c_arquivados"></div><div class="num" id="cArquivados">0</div></div>
  <div class="card"><div class="rot" data-t="c_arquivar"></div><div class="num" id="cArquivar">0</div></div>
  <div class="card"><div class="rot" data-t="c_excluir"></div><div class="num" id="cExcluir">0</div></div>
  <div class="card"><div class="rot" data-t="c_sem_marcacao"></div><div class="num" id="cPendente">0</div></div>
  <div class="card"><div class="rot" data-t="c_parados"></div><div class="num" id="cParado">0</div></div>
</div>

<div class="abas">
  <button data-visao="ativos" class="on"><span data-t="aba_ativos"></span> (<span id="nAtivos">0</span>)</button>
  <button data-visao="arquivados"><span data-t="aba_arquivados"></span> (<span id="nArquivados">0</span>)</button>
</div>

<div class="filtros">
  <input type="text" id="fBusca" data-t-ph="busca">
  <select id="fLinguagem"><option value="" data-t="todas_linguagens"></option></select>
  <select id="fStatus">
    <option value="" data-t="todos_status"></option>
    <option value="pendente" data-t="sem_marcacao"></option>
    <option value="arquivar" data-t="arquivar"></option>
    <option value="excluir" class="so-excluir" data-t="excluir"></option>
  </select>
  <label><input type="checkbox" id="fParado"> <span data-t="so_parados"></span></label>
  <label><input type="checkbox" id="fSemLocal"> <span data-t="so_nao_clonados"></span></label>
</div>

<table>
  <thead>
    <tr>
      <th data-col="nome" data-t="th_nome"></th>
      <th data-col="linguagem" data-t="th_linguagem"></th>
      <th data-col="criado_em" data-t="th_criado"></th>
      <th data-col="atualizado_em" data-t="th_alterado"></th>
      <th data-col="local" data-t="th_local"></th>
      <th data-t="th_status"></th>
      <th style="width:26%" data-t="th_obs"></th>
    </tr>
  </thead>
  <tbody id="corpo"></tbody>
</table>

<div class="legenda" id="legenda"></div>

<!-- Janela: clonar -->
<div class="fundo" id="jClonar">
  <div class="janela">
    <h2 id="jClonarTitulo"></h2>
    <div class="sub" data-t="pasta_destino"></div>
    <div class="linha">
      <input type="text" id="jClonarPasta">
      <button id="jClonarEscolher" data-t="escolher"></button>
    </div>
    <div class="sub" id="jClonarPrevia"></div>
    <div id="jClonarMsg" style="margin-top:8px; white-space:pre-line"></div>
    <div class="rodape">
      <button data-fechar data-t="fechar"></button>
      <button class="principal" id="jClonarOk" data-t="clonar"></button>
    </div>
  </div>
</div>

<!-- Janela: aplicar revisão -->
<div class="fundo" id="jAplicar">
  <div class="janela">
    <h2 data-t="aplicar_titulo"></h2>
    <div id="jAplicarResumo"></div>
    <div id="jAplicarConfirma">
      <div class="sub" id="jAplicarInstrucao"></div>
      <div class="linha"><input type="text" id="jAplicarTexto"></div>
    </div>
    <div id="jAplicarMsg"></div>
    <div class="rodape">
      <button data-fechar data-t="fechar"></button>
      <button class="perigo" id="jAplicarOk" data-t="aplicar_botao"></button>
    </div>
  </div>
</div>

<script>
// ---------- Textos da interface ----------
const TEXTOS = {
  "en": {
    relatorio: "Report", atualizar: "Refresh from GitHub", atualizando: "Refreshing…",
    exportar: "Save review (revisao.json)", aplicar: "Apply review",
    banner_excluir: 'Delete is <b>off</b>. To turn it on, set <code>"permitir_excluir": true</code> in <code>config.json</code> and restart the server. Deleting cannot be undone.',
    c_ativos: "Active", c_arquivados: "Already archived", c_arquivar: "Marked to archive",
    c_excluir: "Marked to delete", c_sem_marcacao: "Unmarked", c_parados: "Stale {n}+ years",
    aba_ativos: "Active", aba_arquivados: "Archived",
    busca: "Search by name or description", todas_linguagens: "All languages", todos_status: "All statuses",
    sem_marcacao: "Unmarked", arquivar: "Archive", excluir: "Delete",
    so_parados: "Only stale {n}+ years", so_nao_clonados: "Only not cloned",
    th_nome: "Name", th_linguagem: "Language", th_criado: "Created", th_alterado: "Last change",
    th_local: "Local", th_status: "Status", th_obs: "Notes",
    legenda: '<span class="parado">Orange date</span> = no changes for more than {n} years · "Local" = exists in a folder under {pasta} · Click a column title to sort · ',
    legenda_servidor: "Marks are saved automatically to revisao.json.",
    legenda_estatico: 'Your marks stay in the browser until you click "Save review".',
    carregado: "{u} · loaded on {d}",
    tag_arquivado: "archived", clonar: "Clone", desarquivar: "Unarchive", desarquivando: "Unarchiving…",
    obs_ph: "e.g. migrate, merge with...",
    salvando: "Saving…", salvo: "Saved", erro_salvar: "Error saving: ", nao_salvo: "Changes not saved to revisao.json",
    desarquivado: "{nome} unarchived", erro_desarquivar: "Error unarchiving: ",
    clonar_titulo: "Clone {nome}", pasta_destino: "Destination folder", escolher: "Choose…",
    vai_criar: "Will create: ", fechar: "Close", clonando: "Cloning…",
    aplicar_titulo: "Apply review on GitHub", aplicar_botao: "Apply",
    resumo_arquivar: "Archive ({n}) — reversible", resumo_excluir: "Delete ({n}) — permanent, no trash", nenhum: "none",
    palavra: "DELETE", digite_para_confirmar: "Type {p} to confirm the deletions", digite_primeiro: "Type {p} to confirm.",
    aplicando: "Applying on GitHub…", feche_recarregar: "Close to reload the list.",
    acao_arquivar: "archive", acao_excluir: "delete",
    relatorio_salvo: "Report saved to ", erro_relatorio: "Report error: ", erro_atualizar: "Error refreshing: "
  },
  "pt-BR": {
    relatorio: "Relatório", atualizar: "Atualizar do GitHub", atualizando: "Atualizando…",
    exportar: "Salvar revisão (revisao.json)", aplicar: "Aplicar revisão",
    banner_excluir: 'Excluir está <b>desligado</b>. Para ligar, mude <code>"permitir_excluir": true</code> no <code>config.json</code> e reinicie o servidor. Exclusão não tem volta.',
    c_ativos: "Ativos", c_arquivados: "Já arquivados", c_arquivar: "Marcados p/ arquivar",
    c_excluir: "Marcados p/ excluir", c_sem_marcacao: "Sem marcação", c_parados: "Parados +{n} anos",
    aba_ativos: "Ativos", aba_arquivados: "Arquivados",
    busca: "Buscar por nome ou descrição", todas_linguagens: "Todas as linguagens", todos_status: "Todos os status",
    sem_marcacao: "Sem marcação", arquivar: "Arquivar", excluir: "Excluir",
    so_parados: "Só parados +{n} anos", so_nao_clonados: "Só não clonados",
    th_nome: "Nome", th_linguagem: "Linguagem", th_criado: "Criado em", th_alterado: "Últ. alteração",
    th_local: "Local", th_status: "Status", th_obs: "Observação",
    legenda: '<span class="parado">Data em laranja</span> = sem alteração há mais de {n} anos · "Local" = existe em alguma pasta de {pasta} · Clique no título da coluna para ordenar · ',
    legenda_servidor: "Marcações são salvas automaticamente no revisao.json.",
    legenda_estatico: 'Suas marcações ficam no navegador até você clicar em "Salvar revisão".',
    carregado: "{u} · carregado em {d}",
    tag_arquivado: "arquivado", clonar: "Clonar", desarquivar: "Desarquivar", desarquivando: "Desarquivando…",
    obs_ph: "Ex: migrar, juntar com...",
    salvando: "Salvando…", salvo: "Salvo", erro_salvar: "Erro ao salvar: ", nao_salvo: "Alterações não salvas no revisao.json",
    desarquivado: "{nome} desarquivado", erro_desarquivar: "Erro ao desarquivar: ",
    clonar_titulo: "Clonar {nome}", pasta_destino: "Pasta de destino", escolher: "Escolher…",
    vai_criar: "Vai criar: ", fechar: "Fechar", clonando: "Clonando…",
    aplicar_titulo: "Aplicar revisão no GitHub", aplicar_botao: "Aplicar",
    resumo_arquivar: "Arquivar ({n}) — reversível", resumo_excluir: "Excluir ({n}) — permanente, sem lixeira", nenhum: "nenhum",
    palavra: "EXCLUIR", digite_para_confirmar: "Digite {p} para confirmar as exclusões", digite_primeiro: "Digite {p} para confirmar.",
    aplicando: "Aplicando no GitHub…", feche_recarregar: "Feche para recarregar a lista.",
    acao_arquivar: "arquivar", acao_excluir: "excluir",
    relatorio_salvo: "Relatório salvo em ", erro_relatorio: "Erro no relatório: ", erro_atualizar: "Erro ao atualizar: "
  }
};

// O script Python substitui tudo entre os dois marcadores pelos dados reais.
// O exemplo abaixo serve só para abrir o template direto no navegador e ver o layout.
const DADOS = /*__DADOS_INICIO__*/{
  "usuario": "example", "gerado_em": "2026-10-14T10:00:00", "pasta_projetos": "~/projetos", "sep": "/",
  "anos_parado": 2, "permitir_excluir": false, "idioma": "en",
  "repos": [
    {"id": "example/new-project", "nome": "new-project", "dono": "example", "linguagem": "C#", "pasta": "csharp",
     "criado_em": "2026-08-12", "atualizado_em": "2026-10-06", "privado": true, "arquivado": false,
     "descricao": "Recent example", "url": "#", "local": true, "status": "", "obs": ""},
    {"id": "example/old-project", "nome": "old-project", "dono": "example", "linguagem": "JavaScript", "pasta": "javascript",
     "criado_em": "2019-09-22", "atualizado_em": "2019-09-25", "privado": false, "arquivado": false,
     "descricao": "Stale example", "url": "#", "local": false, "status": "arquivar", "obs": "Test from 2019"},
    {"id": "my-org/tool", "nome": "tool", "dono": "my-org", "linguagem": "Python", "pasta": "python",
     "criado_em": "2021-03-02", "atualizado_em": "2022-01-10", "privado": false, "arquivado": true,
     "descricao": "Archived example from an organization", "url": "#", "local": false, "status": "", "obs": ""}
  ]
}/*__DADOS_FIM__*/;

const repos = DADOS.repos;
const SERVIDOR = !!DADOS.servidor;              // true quando aberto pelo servidor.py
const CHAVE = "revisao_rascunho_" + DADOS.gerado_em;
const ANOS = DADOS.anos_parado ?? 2;
const LIMITE_PARADO = ANOS * 365 * 24 * 60 * 60 * 1000;
const EXCLUIR = !!DADOS.permitir_excluir;
const SEP = DADOS.sep || "/";
let ordem = { col: "atualizado_em", asc: true };
const $ = id => document.getElementById(id);

// Idioma: o escolhido antes neste navegador; senão o do config.json; senão inglês
let idioma = "en";
try { idioma = localStorage.getItem("idioma") || DADOS.idioma || "en"; } catch (e) { idioma = DADOS.idioma || "en"; }
if (!TEXTOS[idioma]) idioma = "en";

// Texto traduzido, trocando {chaves} pelos valores
function t(chave, valores = {}) {
  const texto = TEXTOS[idioma][chave] ?? TEXTOS.en[chave] ?? chave;
  return texto.replace(/\{(\w+)\}/g, (_, k) => valores[k] ?? "");
}

// Datas: 10/14/2026 3:20 PM (en) ou 14/10/2026 15:20 (pt-BR)
function dataFmt(iso, comHora = false) {
  if (!iso) return "—";
  const [a, m, d] = iso.slice(0, 10).split("-");
  let texto = idioma === "pt-BR" ? `${d}/${m}/${a}` : `${m}/${d}/${a}`;
  if (comHora && iso.length > 10) {
    const h = +iso.slice(11, 13), min = iso.slice(14, 16);
    texto += idioma === "pt-BR" ? ` ${iso.slice(11, 16)}` : ` ${h % 12 || 12}:${min} ${h >= 12 ? "PM" : "AM"}`;
  }
  return texto;
}

// Mensagem curta no topo (texto longo é cortado com "…"; o texto inteiro aparece ao passar o mouse)
function avisar(texto) { $("pendente").textContent = texto; $("pendente").title = texto; }

function esc(x) { return String(x ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

// Aplica o idioma em todos os textos fixos da página
function aplicarIdioma() {
  document.documentElement.lang = idioma;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t, { n: ANOS }));
  document.querySelectorAll("[data-t-html]").forEach(el => el.innerHTML = t(el.dataset.tHtml));
  document.querySelectorAll("[data-t-ph]").forEach(el => el.placeholder = t(el.dataset.tPh));
  document.querySelectorAll(".idioma button").forEach(b => b.classList.toggle("on", b.dataset.idioma === idioma));
  $("info").textContent = t("carregado", { u: DADOS.usuario, d: dataFmt(DADOS.gerado_em, true) });
  $("legenda").innerHTML = t("legenda", { n: ANOS, pasta: esc(DADOS.pasta_projetos || "") })
    + esc(t(SERVIDOR ? "legenda_servidor" : "legenda_estatico"));
  $("jAplicarTexto").placeholder = t("palavra");
}

document.querySelectorAll(".idioma button").forEach(b => b.addEventListener("click", () => {
  idioma = b.dataset.idioma;
  try { localStorage.setItem("idioma", idioma); } catch (e) {}
  aplicarIdioma();
  desenhar();
}));

if (SERVIDOR) document.body.classList.add("servidor");
if (!EXCLUIR) document.body.classList.add("sem-excluir");

// Modo estático: recupera marcações guardadas no navegador
if (!SERVIDOR) {
  try {
    const rascunho = JSON.parse(localStorage.getItem(CHAVE) || "null");
    if (rascunho) repos.forEach(r => { if (rascunho[r.id]) Object.assign(r, rascunho[r.id]); });
  } catch (e) {}
}

repos.forEach(r => {
  r.parado = (Date.now() - new Date(r.atualizado_em)) > LIMITE_PARADO;
  if (r.status === "manter") r.status = "";   // "manter" deixou de existir: sem marcação = manter
});
let visao = "ativos";   // aba atual: "ativos" ou "arquivados"

// Chamada ao servidor.py (o token prova que a ordem veio desta página; o idioma volta nas respostas)
async function api(rota, corpo) {
  const resp = await fetch(rota, { method: "POST",
    headers: { "Content-Type": "application/json", "X-Token": DADOS.token, "X-Idioma": idioma },
    body: JSON.stringify(corpo || {}) });
  const json = await resp.json();
  if (!resp.ok) throw new Error(json.erro || resp.statusText);
  return json;
}

function revisao() {
  const saida = {};
  repos.forEach(r => { if (r.status || r.obs) saida[r.id] = { status: r.status, obs: r.obs }; });
  return saida;
}

// Guarda as marcações: no servidor grava o revisao.json (com espera de 0,8 s); no estático, no navegador
let espera;
function guardarRascunho() {
  if (SERVIDOR) {
    avisar(t("salvando"));
    clearTimeout(espera);
    espera = setTimeout(async () => {
      try { await api("/api/revisao", { revisao: revisao() }); avisar(t("salvo")); }
      catch (e) { avisar(t("erro_salvar") + e.message); }
    }, 800);
  } else {
    try { localStorage.setItem(CHAVE, JSON.stringify(revisao())); } catch (e) {}
    avisar(t("nao_salvo"));
  }
}

function contar() {
  const ativos = repos.filter(r => !r.arquivado), arquivados = repos.filter(r => r.arquivado);
  $("cAtivos").textContent = $("nAtivos").textContent = ativos.length;
  $("cArquivados").textContent = $("nArquivados").textContent = arquivados.length;
  $("cArquivar").textContent = ativos.filter(r => r.status === "arquivar").length;
  $("cExcluir").textContent = repos.filter(r => r.status === "excluir").length;
  $("cPendente").textContent = ativos.filter(r => !r.status).length;
  $("cParado").textContent = repos.filter(r => r.parado).length;
}

function filtrados() {
  const busca = $("fBusca").value.toLowerCase();
  const ling = $("fLinguagem").value;
  const st = $("fStatus").value;
  return repos.filter(r =>
    (visao === "arquivados" ? r.arquivado : !r.arquivado) &&
    (r.id + " " + r.descricao).toLowerCase().includes(busca) &&
    (!ling || (r.linguagem || "—") === ling) &&
    (!st || (st === "pendente" ? !r.status : r.status === st)) &&
    (!$("fParado").checked || r.parado) &&
    (!$("fSemLocal").checked || !r.local)
  ).sort((a, b) => {
    const x = String(a[ordem.col] ?? ""), y = String(b[ordem.col] ?? "");
    return (ordem.asc ? 1 : -1) * x.localeCompare(y, idioma);
  });
}

function celulaLocal(r) {
  if (r.local) return "✔";
  return SERVIDOR ? `<button class="btnClonar">${t("clonar")}</button>` : "—";
}

function desenhar() {
  $("corpo").innerHTML = filtrados().map(r => `
    <tr data-id="${esc(r.id)}">
      <td>
        ${r.privado ? "🔒 " : ""}${r.dono !== DADOS.usuario ? `<span class="dono">${esc(r.dono)}/</span>` : ""}<a href="${esc(r.url)}" target="_blank">${esc(r.nome)}</a>
        ${r.arquivado ? `<span class="tag">${t("tag_arquivado")}</span>` : ""}
        ${r.descricao ? `<div class="desc">${esc(r.descricao)}</div>` : ""}
      </td>
      <td><span class="tag">${esc(r.linguagem || "—")}</span></td>
      <td>${dataFmt(r.criado_em)}</td>
      <td class="${r.parado ? "parado" : ""}">${dataFmt(r.atualizado_em)}</td>
      <td>${celulaLocal(r)}</td>
      <td><div class="status">
        ${r.arquivado && SERVIDOR ? `<button class="btnDesarquivar">${t("desarquivar")}</button>` : ""}
        ${(r.arquivado ? ["excluir"] : ["arquivar", "excluir"]).filter(s => s !== "excluir" || EXCLUIR).map(s =>
          `<button data-s="${s}" class="${r.status === s ? "on" : ""}">${t(s)}</button>`).join("")}
      </div></td>
      <td><input type="text" value="${esc(r.obs)}" placeholder="${esc(t("obs_ph"))}"></td>
    </tr>`).join("");
  contar();
}

const repoDaLinha = el => repos.find(x => x.id === el.closest("tr").dataset.id);

// Cliques na tabela: status, clonar e desarquivar
$("corpo").addEventListener("click", e => {
  const b = e.target.closest(".status button[data-s]");
  if (b) {
    const r = repoDaLinha(b);
    r.status = r.status === b.dataset.s ? "" : b.dataset.s;   // clicar de novo desmarca
    guardarRascunho(); desenhar();
  }
  if (e.target.closest(".btnClonar")) abrirClonar(repoDaLinha(e.target));
  const bd = e.target.closest(".btnDesarquivar");
  if (bd) desarquivar(bd, repoDaLinha(bd));
});

// Desarquivar: age na hora (é reversível); o repositório volta para a aba Ativos
async function desarquivar(botao, r) {
  botao.disabled = true;
  botao.textContent = t("desarquivando");
  try {
    const res = await api("/api/desarquivar", { id: r.id });
    if (!res.ok) throw new Error(res.msg);
    r.arquivado = false;
    r.status = "";
    avisar(t("desarquivado", { nome: r.nome }));
    desenhar();
  } catch (e) {
    avisar(t("erro_desarquivar") + e.message);
    botao.disabled = false;
    botao.textContent = t("desarquivar");
  }
}

// Troca de aba (Ativos / Arquivados)
document.querySelectorAll(".abas button").forEach(b => b.addEventListener("click", () => {
  visao = b.dataset.visao;
  document.querySelectorAll(".abas button").forEach(x => x.classList.toggle("on", x === b));
  desenhar();
}));

// Digitação na observação
$("corpo").addEventListener("input", e => {
  if (e.target.type !== "text") return;
  repoDaLinha(e.target).obs = e.target.value;
  guardarRascunho(); contar();
});

document.querySelectorAll("th[data-col]").forEach(th => th.addEventListener("click", () => {
  ordem = { col: th.dataset.col, asc: ordem.col === th.dataset.col ? !ordem.asc : true };
  desenhar();
}));

["fBusca", "fLinguagem", "fStatus", "fParado", "fSemLocal"].forEach(id => $(id).addEventListener("input", desenhar));

// Fechar janelas
document.querySelectorAll("[data-fechar]").forEach(b =>
  b.addEventListener("click", () => b.closest(".fundo").classList.remove("aberto")));

// ---------- Clonar ----------
let repoClonar = null;
function previaClonar() {
  $("jClonarPrevia").textContent = t("vai_criar") + $("jClonarPasta").value.replace(/[\\/]+$/, "") + SEP + repoClonar.nome;
}
function abrirClonar(r) {
  repoClonar = r;
  $("jClonarTitulo").textContent = t("clonar_titulo", { nome: r.nome });
  $("jClonarPasta").value = (DADOS.pasta_projetos || "") + SEP + (r.pasta || "outros");
  $("jClonarMsg").textContent = "";
  $("jClonarOk").disabled = false;
  previaClonar();
  $("jClonar").classList.add("aberto");
}
$("jClonarPasta").addEventListener("input", previaClonar);
$("jClonarEscolher").addEventListener("click", async () => {
  try {
    const { pasta } = await api("/api/escolher-pasta", { inicial: $("jClonarPasta").value });
    if (pasta) { $("jClonarPasta").value = pasta; previaClonar(); }
  } catch (e) { $("jClonarMsg").innerHTML = `<span class="erro">${esc(e.message)}</span>`; }
});
$("jClonarOk").addEventListener("click", async () => {
  $("jClonarOk").disabled = true;
  $("jClonarMsg").textContent = t("clonando");
  try {
    const res = await api("/api/clonar", { id: repoClonar.id, pasta: $("jClonarPasta").value });
    $("jClonarMsg").innerHTML = `<span class="${res.ok ? "ok" : "erro"}">${esc(res.msg)}</span>`;
    if (res.ok) { repoClonar.local = true; desenhar(); }
    else $("jClonarOk").disabled = false;
  } catch (e) {
    $("jClonarMsg").innerHTML = `<span class="erro">${esc(e.message)}</span>`;
    $("jClonarOk").disabled = false;
  }
});

// ---------- Aplicar revisão ----------
const paraArquivar = () => repos.filter(r => r.status === "arquivar" && !r.arquivado);
const paraExcluir = () => EXCLUIR ? repos.filter(r => r.status === "excluir") : [];

$("btnAplicar").addEventListener("click", () => {
  const arq = paraArquivar(), exc = paraExcluir();
  const nomes = l => l.map(r => esc(r.id)).join(", ") || t("nenhum");
  $("jAplicarResumo").innerHTML =
    `<div class="aviso">${t("resumo_arquivar", { n: arq.length })}</div><div class="lista">${nomes(arq)}</div>`
    + (EXCLUIR ? `<div class="erro">${t("resumo_excluir", { n: exc.length })}</div><div class="lista">${nomes(exc)}</div>` : "");
  $("jAplicarInstrucao").textContent = t("digite_para_confirmar", { p: t("palavra") });
  $("jAplicarConfirma").style.display = exc.length ? "" : "none";
  $("jAplicarTexto").value = "";
  $("jAplicarMsg").textContent = "";
  $("jAplicarOk").disabled = !(arq.length || exc.length);
  $("jAplicar").classList.add("aberto");
});

$("jAplicarOk").addEventListener("click", async () => {
  if (paraExcluir().length && $("jAplicarTexto").value !== t("palavra")) {
    $("jAplicarMsg").innerHTML = `<span class="erro">${t("digite_primeiro", { p: t("palavra") })}</span>`;
    return;
  }
  $("jAplicarOk").disabled = true;
  $("jAplicarMsg").textContent = t("aplicando");
  try {
    const { resultados } = await api("/api/aplicar", { revisao: revisao(), confirmacao: $("jAplicarTexto").value });
    $("jAplicarMsg").innerHTML = resultados.map(x =>
      `<div class="${x.ok ? "ok" : "erro"}">${x.ok ? "✔" : "✖"} ${t("acao_" + x.acao)}: ${esc(x.id)}${x.ok ? "" : " — " + esc(x.msg)}</div>`).join("")
      + `<div class="sub" style="margin-top:8px">${t("feche_recarregar")}</div>`;
    $("jAplicar").querySelector("[data-fechar]").onclick = () => location.reload();
  } catch (e) {
    $("jAplicarMsg").innerHTML = `<span class="erro">${esc(e.message)}</span>`;
    $("jAplicarOk").disabled = false;
  }
});

// ---------- Relatório ----------
$("btnRelatorio").addEventListener("click", async () => {
  try {
    const { arquivo } = await api("/api/relatorio");
    avisar(t("relatorio_salvo") + arquivo);
  } catch (e) { avisar(t("erro_relatorio") + e.message); }
});

// ---------- Atualizar do GitHub ----------
$("btnAtualizar").addEventListener("click", async () => {
  $("btnAtualizar").disabled = true;
  $("btnAtualizar").textContent = t("atualizando");
  try { await api("/api/atualizar"); location.reload(); }
  catch (e) {
    avisar(t("erro_atualizar") + e.message);
    $("btnAtualizar").disabled = false;
    $("btnAtualizar").textContent = t("atualizar");
  }
});

// ---------- Salvar revisão (modo estático) ----------
$("btnExportar").addEventListener("click", async () => {
  const texto = JSON.stringify(revisao(), null, 2);
  try {
    if (window.showSaveFilePicker) {
      const h = await showSaveFilePicker({ suggestedName: "revisao.json",
        types: [{ description: "JSON", accept: { "application/json": [".json"] } }] });
      const w = await h.createWritable(); await w.write(texto); await w.close();
    } else {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([texto], { type: "application/json" }));
      a.download = "revisao.json"; a.click();
    }
    avisar("");
  } catch (e) { /* usuário cancelou */ }
});

// Preenche o filtro de linguagens, aplica o idioma e desenha a tabela
[...new Set(repos.map(r => r.linguagem || "—"))].sort().forEach(l =>
  $("fLinguagem").insertAdjacentHTML("beforeend", `<option>${esc(l)}</option>`));
aplicarIdioma();
desenhar();
</script>
</body>
</html>
